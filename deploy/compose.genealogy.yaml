name: genealogy
services:
  api:
    image: python:3.13-alpine
    command: ["python", "-B", "/app/app.py"]
    restart: unless-stopped
    environment:
      FAMILY_BIND: 0.0.0.0
      FAMILY_BASE: /site/current/data/family.json
      FAMILY_DB: /private/editor.sqlite3
      FAMILY_ORIGIN: https://family.maark.ru
    volumes:
      - ./server:/app:ro
      - ./site:/site:ro
      - ./private:/private
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    networks: [family]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8094:8080"]
    volumes:
      - ./site:/srv:ro
      - ./private/Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs: [/tmp, /config, /data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    networks: [family]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8080/healthz 2>&1 | grep -q '401 Unauthorized'"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  family:
    internal: true
